<!doctype html>
<html lang="en" class="bg-gray-50 dark:bg-gray-900">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accountly</title>
  <script>
    (function () {
      try {
        const savedTheme = localStorage.getItem('app-theme');
        if (savedTheme) {
          const parsed = JSON.parse(savedTheme);
          if (parsed && parsed.color && parsed.color !== 'default') {
            document.documentElement.classList.add('theme-' + parsed.color);
          }
          if (parsed && parsed.mode === 'dark') {
            document.documentElement.classList.add('dark');
          }
        }
      } catch (e) {}
    })();
  </script>
</head>

<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 min-h-screen">
  <div id="root" class="min-h-screen"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
